<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LPM OWL — Contact</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#1b212b;
    --bg-deep:#141922;
    --panel:#222b37;
    --field:#1e2733;
    --cyan:#5bc8d4;
    --cyan-bright:#6fd8e4;
    --white:#f4f7f9;
    --muted:#8b97a6;
    --border:#33414f;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(91,200,212,.10), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    background-attachment:fixed;
    color:var(--white);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:44px 20px 60px;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{width:100%;max-width:480px}

  .logo{
    display:block;
    width:150px;height:auto;object-fit:contain;
    margin:0 auto 14px;
    filter:drop-shadow(0 0 26px rgba(91,200,212,.25));
  }

  .eyebrow{
    font-family:'Oswald',sans-serif;
    font-weight:600;letter-spacing:.22em;
    font-size:.72rem;text-transform:uppercase;
    color:var(--cyan);text-align:center;margin-bottom:10px;
  }

  h1{
    font-family:'Oswald',sans-serif;font-weight:700;
    text-transform:uppercase;font-size:1.8rem;line-height:1.05;
    text-align:center;margin-bottom:8px;
  }
  h1 .accent{color:var(--cyan)}

  .sub{
    color:var(--muted);font-size:.92rem;
    text-align:center;margin-bottom:32px;line-height:1.5;
  }

  .form{display:flex;flex-direction:column;gap:16px}

  .row{display:flex;gap:14px}
  .row .group{flex:1}

  .group{display:flex;flex-direction:column;gap:7px}

  label{
    font-size:.82rem;font-weight:600;color:var(--white);
    letter-spacing:.01em;
  }
  label .req{color:var(--cyan)}

  input, textarea{
    font-family:'Inter',sans-serif;
    background:var(--field);
    border:1px solid var(--border);
    border-radius:11px;
    padding:13px 15px;
    color:var(--white);
    font-size:.95rem;
    transition:border-color .15s ease, box-shadow .15s ease;
    width:100%;
  }
  input::placeholder, textarea::placeholder{color:#5d6b7a}
  input:focus, textarea:focus{
    outline:none;
    border-color:var(--cyan);
    box-shadow:0 0 0 3px rgba(91,200,212,.15);
  }
  textarea{resize:vertical;min-height:110px}

  .consent{
    display:flex;align-items:flex-start;gap:11px;
    margin-top:2px;
  }
  .consent input{
    width:18px;height:18px;flex:0 0 18px;margin-top:1px;
    accent-color:var(--cyan);cursor:pointer;
  }
  .consent label{
    font-size:.8rem;font-weight:400;color:var(--muted);
    line-height:1.45;cursor:pointer;
  }
  .consent a{color:var(--cyan);text-decoration:none}
  .consent a:hover{text-decoration:underline}

  button{
    font-family:'Oswald',sans-serif;
    font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    font-size:1rem;
    background:linear-gradient(135deg, var(--cyan) 0%, #49b3bf 100%);
    color:#0e1620;border:none;border-radius:12px;
    padding:16px;cursor:pointer;margin-top:6px;
    transition:transform .15s ease, filter .15s ease;
  }
  button:hover{transform:translateY(-2px);filter:brightness(1.05)}
  button:active{transform:translateY(0)}
  button:disabled{opacity:.6;cursor:default;transform:none}

  .result{
    text-align:center;font-size:.92rem;margin-top:4px;
    min-height:20px;
  }
  .result.ok{color:var(--cyan)}
  .result.err{color:#ff8080}

  @media (max-width:440px){
    .row{flex-direction:column;gap:16px}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
  }
</style>
</head>

    <div class="eyebrow">LPM OWL · Plan de Campagne</div>
    <h1>Une <span class="accent">question</span> ?</h1>
    <p class="sub">Écris-nous, on te répond rapidement.</p>

    <form class="form" id="contactForm">
      <input type="hidden" name="access_key" value="11fa4f94-200e-4cb0-a753-b0a5423dbe26">
      <input type="hidden" name="subject" value="Nouveau message — Contact LPM OWL">
      <input type="hidden" name="from_name" value="Site LPM OWL">
      <!-- anti-spam honeypot -->
      <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">

      <div class="row">
        <div class="group">
          <label for="prenom">Prénom <span class="req">*</span></label>
          <input type="text" id="prenom" name="Prénom" placeholder="François" required>
        </div>
        <div class="group">
          <label for="nom">Nom <span class="req">*</span></label>
          <input type="text" id="nom" name="Nom" placeholder="Dupont" required>
        </div>
      </div>

      <div class="group">
        <label for="email">Email <span class="req">*</span></label>
        <input type="email" id="email" name="Email" placeholder="ton@email.com" required>
      </div>

      <div class="group">
        <label for="tel">Téléphone</label>
        <input type="tel" id="tel" name="Téléphone" placeholder="06 12 34 56 78">
      </div>

      <div class="group">
        <label for="message">Ta question <span class="req">*</span></label>
        <textarea id="message" name="Message" placeholder="Pose-nous ta question ici…" required></textarea>
      </div>

      <div class="consent">
        <input type="checkbox" id="rgpd" required>
        <label for="rgpd">J'accepte d'être recontacté·e par LPM OWL concernant ma demande. Mes données ne seront jamais transmises à des tiers.</label>
      </div>

      <button type="submit" id="submitBtn">Envoyer ma demande</button>
      <div class="result" id="result"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById('contactForm');
    const result = document.getElementById('result');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function(e){
      e.preventDefault();
      btn.disabled = true;
      result.className = 'result';
      result.textContent = 'Envoi en cours…';

      const formData = new FormData(form);
      const object = Object.fromEntries(formData);
      const json = JSON.stringify(object);

      try{
        const res = await fetch('https://api.web3forms.com/submit', {
          method:'POST',
          headers:{'Content-Type':'application/json', 'Accept':'application/json'},
          body:json
        });
        const data = await res.json();
        if(data.success){
          result.className = 'result ok';
          result.textContent = '✓ Message envoyé ! On te répond vite.';
          form.reset();
        }else{
          result.className = 'result err';
          result.textContent = 'Oups, une erreur est survenue. Réessaie ou écris-nous sur Instagram.';
        }
      }catch(err){
        result.className = 'result err';
        result.textContent = 'Erreur de connexion. Réessaie dans un instant.';
      }finally{
        btn.disabled = false;
      }
    });
  </script>
